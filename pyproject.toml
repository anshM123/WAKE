[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wake-mapper"
version = "0.2.0"
description = "Research platform for propeller-wake-based probabilistic room mapping"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "PyYAML>=6,<7"]

[project.optional-dependencies]
vision = ["opencv-contrib-python>=4.9,<5"]
science = ["scipy>=1.12,<2", "scikit-learn>=1.4,<2", "matplotlib>=3.8,<4"]
test = ["pytest>=8,<9"]

[project.scripts]
wake = "wake.cli:main"

[tool.setuptools.packages.find]
include = ["wake*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
